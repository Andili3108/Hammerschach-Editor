<script id="reader-side-tabs-js">
(function(){
  const buttons={
    moves:document.getElementById('showReaderMovesBtn'),
    engine:document.getElementById('showReaderEngineBtn'),
    game:document.getElementById('showReaderGameBtn')
  };
  const panels={
    moves:document.getElementById('readerMovesPanel'),
    engine:document.getElementById('readerEnginePanel'),
    game:document.getElementById('readerGamePanel')
  };
  function showReaderPanel(name){
    if(!buttons[name]||!panels[name])name='game';
    Object.keys(buttons).forEach(key=>{
      const active=key===name;
      buttons[key].classList.toggle('active',active);
      buttons[key].setAttribute('aria-selected',active?'true':'false');
      panels[key].hidden=!active;
    });
    if(name==='engine'&&typeof requestEngineAnalysis==='function')requestEngineAnalysis(false);
  }
  Object.keys(buttons).forEach(key=>buttons[key]&&buttons[key].addEventListener('click',()=>showReaderPanel(key)));
  showReaderPanel('game');
  window.hammerschachReaderShowPanel=showReaderPanel;
})();
</script>



<script id="reader-board-color-js">
(function(){
  const boardColorWrap = document.getElementById('readerBoardColorWrap');
  const btnBoardColor = document.getElementById('btnReaderBoardColor');
  const boardColorPopup = document.getElementById('readerBoardColorPopup');
  const boardColorCurrent = document.getElementById('readerBoardColorCurrent');
  const boardColorOptions = document.querySelectorAll('.reader-board-color-option[data-board-color]');
  const pieceSetWrap = document.getElementById('readerPieceSetWrap');
  const btnPieceSet = document.getElementById('btnReaderPieceSet');
  const pieceSetPopup = document.getElementById('readerPieceSetPopup');
  const pieceSetCurrent = document.getElementById('readerPieceSetCurrent');
  const pieceSetOptions = document.querySelectorAll('.reader-piece-set-option[data-piece-set]');
  const BOARD_COLOR_STORAGE_KEY = 'hammerschachBoardColor';
  const PIECE_SET_STORAGE_KEY = 'hammerschachPieceSet';
  const boardColorPresets = [
    {id:'basis', name:'Hammerschach Rubin', light:'#f0d9b5', dark:'#843f46', material:'classic'},
    {id:'braun', name:'Walnuss', light:'#f3ddb7', dark:'#b4875e', material:'classic'},
    {id:'grau', name:'Schiefer', light:'#eeeeee', dark:'#9b9b9b', material:'classic'},
    {id:'gruen', name:'Turniergrün', light:'#eeeed2', dark:'#769656', material:'classic'},
    {id:'onyx-elegance', name:'Premium · Warm', light:'#f2e7d2f0', dark:'#7f8389d0', material:'onyx-elegance', frameDark:'#2a2f34', frameMid:'#50555c', frameLight:'#b58a43', coordLight:'#fff1d4', coordDark:'#0d0e10'},
    {id:'royal-walnut', name:'Royal Walnut · Holz', light:'#d9c29e', dark:'#8a6845', material:'royal-walnut', frameDark:'#5e4228', frameMid:'#8b6945', frameLight:'#c89c66', coordLight:'#fff3df', coordDark:'#1b1008'}
  ];

  function boardRgbFromHex(value){
    const normalized=String(value||'').trim().replace(/^#/,'').slice(0,6);
    const full=normalized.length===3?normalized.split('').map(char=>char+char).join(''):normalized;
    if(!/^[0-9a-f]{6}$/i.test(full))return{r:0,g:0,b:0};
    return{r:parseInt(full.slice(0,2),16),g:parseInt(full.slice(2,4),16),b:parseInt(full.slice(4,6),16)};
  }
  function mixBoardHex(base,overlay,amount){
    const from=boardRgbFromHex(base),to=boardRgbFromHex(overlay),ratio=Math.max(0,Math.min(1,Number(amount)||0));
    const channel=key=>Math.round(from[key]+(to[key]-from[key])*ratio).toString(16).padStart(2,'0');
    return'#'+channel('r')+channel('g')+channel('b');
  }
  function applyBoardMaterialVariables(preset){
    const root=document.documentElement.style;
    root.setProperty('--board-frame-dark',preset.frameDark||mixBoardHex(preset.dark,'#000000',.62));
    root.setProperty('--board-frame-mid',preset.frameMid||mixBoardHex(preset.dark,'#000000',.31));
    root.setProperty('--board-frame-light',preset.frameLight||mixBoardHex(preset.dark,'#ffffff',.24));
    root.setProperty('--board-coord-dark',preset.coordDark||mixBoardHex(preset.dark,'#000000',.58));
    root.setProperty('--board-coord-light',preset.coordLight||mixBoardHex(preset.light,'#ffffff',.56));
    document.documentElement.dataset.boardMaterial=preset.material||'classic';
  }

  function closeBoardColorPopup(){
    if(!boardColorPopup || !btnBoardColor) return;
    boardColorPopup.hidden = true;
    btnBoardColor.setAttribute('aria-expanded','false');
  }

  function openBoardColorPopup(){
    if(!boardColorPopup || !btnBoardColor) return;
    closePieceSetPopup();
    boardColorPopup.hidden = false;
    btnBoardColor.setAttribute('aria-expanded','true');
  }
  function closePieceSetPopup(){
    if(!pieceSetPopup || !btnPieceSet) return;
    pieceSetPopup.hidden = true;
    btnPieceSet.setAttribute('aria-expanded','false');
  }
  function openPieceSetPopup(){
    if(!pieceSetPopup || !btnPieceSet) return;
    closeBoardColorPopup();
    pieceSetPopup.hidden = false;
    btnPieceSet.setAttribute('aria-expanded','true');
  }

  function applyBoardColorPreset(id, closeAfterSelection){
    const preset = boardColorPresets.find(p => p.id === id) || boardColorPresets[0];
    document.documentElement.style.setProperty('--light-square', preset.light);
    document.documentElement.style.setProperty('--dark-square', preset.dark);
    applyBoardMaterialVariables(preset);
    if(boardColorCurrent) boardColorCurrent.textContent = preset.name;
    boardColorOptions.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.boardColor === preset.id);
    });
    try{ localStorage.setItem(BOARD_COLOR_STORAGE_KEY, preset.id); }catch(_e){}
    if(closeAfterSelection) closeBoardColorPopup();
  }
  function applyPieceSetPreset(id, closeAfterSelection){
    const normalized=id==='rhosgfx'?'merida':id;
    const preset=typeof pieceSetPresets!=='undefined'?(pieceSetPresets.find(item=>item.id===normalized)||pieceSetPresets[0]):null;
    if(!preset||typeof pieceImg==='undefined')return;
    if(typeof activePieceSetId!=='undefined')activePieceSetId=preset.id;
    document.documentElement.dataset.pieceSet=preset.id;
    Object.keys(pieceImg).forEach(key=>delete pieceImg[key]);Object.assign(pieceImg,preset.paths);
    if(pieceSetCurrent)pieceSetCurrent.textContent=preset.name;
    pieceSetOptions.forEach(btn=>btn.classList.toggle('active',btn.dataset.pieceSet===preset.id));
    try{localStorage.setItem(PIECE_SET_STORAGE_KEY,preset.id);}catch(_e){}
    if(typeof renderBoardFromView==='function')renderBoardFromView();
    if(closeAfterSelection)closePieceSetPopup();
  }

  if(btnBoardColor){
    btnBoardColor.addEventListener('click', function(ev){
      ev.stopPropagation();
      if(boardColorPopup && boardColorPopup.hidden) openBoardColorPopup();
      else closeBoardColorPopup();
    });
  }
  if(btnPieceSet){
    btnPieceSet.addEventListener('click', function(ev){
      ev.stopPropagation();
      if(pieceSetPopup && pieceSetPopup.hidden) openPieceSetPopup();
      else closePieceSetPopup();
    });
  }

  boardColorOptions.forEach(btn => {
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      applyBoardColorPreset(btn.dataset.boardColor, true);
    });
  });
  pieceSetOptions.forEach(btn=>{
    btn.addEventListener('click',function(ev){ev.stopPropagation();applyPieceSetPreset(btn.dataset.pieceSet,true);});
  });

  document.addEventListener('click', function(ev){
    if(boardColorWrap && !boardColorWrap.contains(ev.target)) closeBoardColorPopup();
    if(pieceSetWrap && !pieceSetWrap.contains(ev.target)) closePieceSetPopup();
  });

  document.addEventListener('keydown', function(ev){
    if(ev.key === 'Escape'){closeBoardColorPopup();closePieceSetPopup();}
  });

  let savedBoardColorPreset = 'basis';
  try{ savedBoardColorPreset = localStorage.getItem(BOARD_COLOR_STORAGE_KEY) || 'basis'; }catch(_e){}
  applyBoardColorPreset(savedBoardColorPreset, false);
  let savedPieceSet='cburnett';try{savedPieceSet=localStorage.getItem(PIECE_SET_STORAGE_KEY)||'cburnett';}catch(_e){}
  applyPieceSetPreset(savedPieceSet,false);
  window.hammerschachReaderApplyBoardColor=applyBoardColorPreset;
  window.hammerschachReaderApplyPieceSet=applyPieceSetPreset;
})();
</script>

<script id="reader-gamer-bridge">
(function(){
  const archiveSelect=document.getElementById('archiveSelect');
  const archiveReloadBtn=document.getElementById('archiveReloadBtn');
  const archiveStatus=document.getElementById('archiveStatus');
  const SELECTED_KEY='hammerschachReaderArchiveSelectedV1';
  const DEFAULT_ARCHIVES=[
    {id:'archive_1',name:'SV Ruhrgebiet',file:'SVRuhrgebiet.txt'},
    {id:'archive_2',name:'Unna Open',file:'UnnaOpen.txt'},
    {id:'archive_3',name:'NRW-Klasse 1',file:'NRWKlasse1.txt'},
    {id:'archive_4',name:'Verbandsbezirksliga 1',file:'Verbandsbezirksliga1.txt'},
    {id:'archive_5',name:'NRW-Liga 1',file:'NRWLiga1.txt'}
  ];
  const pending=new Map();
  let requestCounter=0;
  let archives=[];
  let currentContext={loggedIn:false,isAdmin:false};

  function targetOrigin(){return window.location.origin&&window.location.origin!=='null'?window.location.origin:'*';}
  function post(message){if(window.parent&&window.parent!==window)window.parent.postMessage(message,targetOrigin());}
  function request(type,payload){
    return new Promise((resolve,reject)=>{
      const requestId='reader_'+Date.now()+'_'+(++requestCounter);
      const timer=setTimeout(()=>{pending.delete(requestId);reject(new Error('Die Anfrage hat zu lange gedauert.'));},12000);
      pending.set(requestId,{resolve,reject,timer});
      post(Object.assign({type,requestId},payload||{}));
    });
  }
  function settle(message){
    const item=pending.get(String(message.requestId||''));
    if(!item)return false;
    clearTimeout(item.timer);pending.delete(String(message.requestId||''));
    if(message.ok===false)item.reject(new Error(message.message||'Die Anfrage ist fehlgeschlagen.'));else item.resolve(message);
    return true;
  }
  function setArchiveStatus(message,kind){if(!archiveStatus)return;archiveStatus.textContent=message||'';archiveStatus.className='archive-status'+(kind?' '+kind:'');}
  function renderArchiveOptions(){
    if(!archiveSelect)return;
    archiveSelect.replaceChildren();
    if(!archives.length){
      const option=document.createElement('option');option.value='';option.textContent='Momentan ist kein Partienarchiv freigeschaltet.';archiveSelect.appendChild(option);
      archiveSelect.disabled=true;if(archiveReloadBtn)archiveReloadBtn.disabled=true;return;
    }
    archives.forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=item.name;archiveSelect.appendChild(option);});
    let selected='';try{selected=localStorage.getItem(SELECTED_KEY)||'';}catch(_){}
    if(!archives.some(item=>item.id===selected))selected=archives[0].id;
    archiveSelect.value=selected;archiveSelect.disabled=false;if(archiveReloadBtn)archiveReloadBtn.disabled=false;
    loadSelectedArchive();
  }
  async function loadSelectedArchive(){
    const selected=archives.find(item=>item.id===String(archiveSelect&&archiveSelect.value||''));
    if(!selected)return;
    if(archiveSelect)archiveSelect.disabled=true;if(archiveReloadBtn)archiveReloadBtn.disabled=true;
    try{
      await loadArchiveFile(selected.file,selected.name);
      try{localStorage.setItem(SELECTED_KEY,selected.id);}catch(_){}
    }catch(error){
      importedGames=[];currentGameIndex=-1;setArchiveStatus(error&&error.message?error.message:'Das Archiv konnte nicht geladen werden.','error');
    }finally{
      if(archiveSelect)archiveSelect.disabled=false;if(archiveReloadBtn)archiveReloadBtn.disabled=false;reportHeight();
    }
  }
  async function loadArchives(){
    setArchiveStatus('Archivkonfiguration wird geladen …','');
    try{
      const result=await request('hammerschach-reader-request-archives');
      archives=Array.isArray(result.archives)?result.archives:[];renderArchiveOptions();
    }catch(error){
      archives=DEFAULT_ARCHIVES.slice();renderArchiveOptions();
      setArchiveStatus('Die vorkonfigurierten Partienarchive werden verwendet.','');
    }
  }
  function applyContext(context){
    currentContext=context||{};
    document.documentElement.classList.toggle('dark-mode',!!currentContext.darkMode);
    if(typeof window.hammerschachReaderApplyBoardColor==='function')window.hammerschachReaderApplyBoardColor(String(currentContext.boardColor||'basis'),false);
    if(typeof window.hammerschachReaderApplyPieceSet==='function')window.hammerschachReaderApplyPieceSet(String(currentContext.pieceSet||'cburnett'),false);
  }
  function reportHeight(){post({type:'hammerschach-reader-height',height:Math.max(document.documentElement.scrollHeight,document.body.scrollHeight)});}

  if(archiveSelect)archiveSelect.addEventListener('change',loadSelectedArchive);
  if(archiveReloadBtn)archiveReloadBtn.addEventListener('click',loadSelectedArchive);
  window.addEventListener('message',event=>{
    if(targetOrigin()!=='*'&&event.origin!==targetOrigin())return;
    const message=event.data&&typeof event.data==='object'?event.data:{};
    if(settle(message))return;
    if(message.type==='hammerschach-reader-context'){applyContext(message);if(message.loggedIn&&!archives.length)loadArchives();return;}
    if(message.type==='hammerschach-reader-refresh-archives'){loadArchives();return;}
    if(message.type==='hammerschach-reader-visibility'){
      if(!message.visible&&typeof stopEngineAnalysis==='function')stopEngineAnalysis(true);
      else if(message.visible&&typeof requestEngineAnalysis==='function')requestEngineAnalysis(false);
    }
  });
  window.addEventListener('resize',reportHeight);
  if(typeof ResizeObserver==='function'&&document.body){try{new ResizeObserver(reportHeight).observe(document.body);}catch(_){}}
  post({type:'hammerschach-reader-ready'});reportHeight();
})();
</script>
