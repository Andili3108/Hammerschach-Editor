<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taktik-Player</title>
<style>
  :root {
    --light: #f0d9b5;
    --dark: #843f46;
    --frame: #2f2b28;
    --text: #1f1d1b;
    --muted: #6c6259;
    --panel: #fffdf9;
    --accent: #355c8a;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; margin: 0; padding: 0; background: transparent; color: var(--text); font-family: "Times New Roman", Times, serif; overflow-x: hidden; }
  body { padding: 10px 8px 14px; font-size: 18px; }
  .reader {
    --board-size: min(600px, 100%);
    width: min(620px, 100%);
    max-width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .topbar {
    width: var(--board-size);
    max-width: 100%;
    display: grid;
    grid-template-columns: auto 52px 52px 190px;
    justify-content: center;
    align-items: center;
    gap: 10px 12px;
    min-height: 52px;
    padding: 4px 4px 0;
  }
  .control {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 1.12rem;
  }
  label {
    white-space: nowrap;
  }
  select, button {
    font: inherit;
    border-radius: 10px;
    padding: 6px 12px;
  }
  select {
    border: 1px solid #b8ada2;
  }
  button {
    cursor: pointer;
    min-width: 52px;
    height: 52px;
    border: 1px solid #cfcfcf;
    background: #e6e6e6;
    color: #9A2D33;
    font-size: 18px;
    font-weight: 600;
    box-shadow: 0 2px 5px rgba(0,0,0,0.18);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: filter .15s ease, transform .05s ease;
  }
  button:hover {
    filter: brightness(1.02);
  }
  button:active {
    transform: translateY(1px);
  }
  select:hover { border-color: #8e8277; }
  .status {
    width: 190px;
    min-height: 58px;
    padding: 5px 10px 6px;
    border: 1px solid #cab9a8;
    border-radius: 14px;
    background: linear-gradient(180deg, #fffdf9 0%, #f5eee6 100%);
    box-shadow: 0 3px 8px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.8);
    color: var(--text);
    text-align: center;
    justify-self: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    position: relative;
    overflow: hidden;
  }
  .status::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: #843f46;
    opacity: 0.9;
  }
  .status-hint {
    font-size: 0.78rem;
    line-height: 1;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7b6d60;
    font-weight: 700;
  }
  .status-main {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 1.26rem;
    line-height: 1.15;
    font-weight: 700;
    white-space: nowrap;
  }
  .status-dot {
    width: 0.72em;
    height: 0.72em;
    border-radius: 50%;
    flex: 0 0 auto;
    border: 1px solid rgba(0,0,0,0.28);
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .status.white-turn .status-dot {
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f5f0e9 65%, #d7cbc0 100%);
  }
  .status.black-turn .status-dot {
    background: radial-gradient(circle at 35% 35%, #696969 0%, #2c2c2c 60%, #111111 100%);
    border-color: rgba(255,255,255,0.18);
  }
  .board-wrap {
    width: var(--board-size);
    max-width: 100%;
    display: flex;
    justify-content: center;
  }
  .board {
    width: 100%;
    aspect-ratio: 1 / 1;
    height: auto;
    border: 3px solid var(--frame);
    border-radius: 8px;
    overflow: hidden;
    display: grid;
    grid-template-columns: repeat(8,1fr);
    grid-template-rows: repeat(8,1fr);
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    background: #fff;
  }
  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sq.light { background: var(--light); }
  .sq.dark { background: var(--dark); }
  .piece {
    width: 82%;
    height: 82%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.22));
  }
  .coord-file, .coord-rank {
    position: absolute;
    font-size: 0.82rem;
    line-height: 1;
    font-weight: 700;
    opacity: 0.72;
    pointer-events: none;
    user-select: none;
  }
  .coord-file { right: 6px; bottom: 4px; }
  .coord-rank { left: 6px; top: 4px; }
  .sq.light .coord-file, .sq.light .coord-rank { color: rgba(90,52,28,0.8); }
  .sq.dark .coord-file, .sq.dark .coord-rank { color: rgba(255,244,226,0.88); }
  .figurine {
    width: 0.92em;
    height: 0.92em;
    vertical-align: -0.1em;
    margin: 0 0.03em;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.16));
  }
  .movectrl {
    width: var(--board-size);
    max-width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 4px;
  }
  .movectrl button {
    min-width: 52px;
    padding: 6px 14px;
    font-size: 24px;
    line-height: 1;
    letter-spacing: 0;
  }
  input[type="number"] {
    width: 94px;
    min-width: 0;
    height: 52px;
    padding: 6px 10px;
    font-size: 1.12rem;
    font-family: inherit;
    border: 1px solid #cfcfcf;
    border-radius: 10px;
    background: #fffdf9;
    color: var(--text);
  }
  .solutionline {
    width: min(600px, var(--board-size));
    max-width: 100%;
    min-height: 52px;
    text-align: center;
    font-size: 1.18rem;
    font-weight: 700;
    line-height: 1.45;
    color: var(--text);
    padding: 18px 10px 0;
    margin-top: 8px;
    margin-bottom: 8px;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: normal;
  }
  .solutionline.hidden {
    visibility: hidden;
  }
  button:disabled {
    opacity: 0.68;
    cursor: default;
  }
  @media (max-width: 520px) {
    body { padding: 8px 6px 12px; font-size: 16px; }
    .reader { gap: 8px; }
    .topbar {
      gap: 8px;
      grid-template-columns: minmax(0, 1fr) 42px 42px;
      align-items: stretch;
    }
    .control {
      min-width: 0;
    }
    input, button { padding: 4px 8px; }
    button {
      height: 42px;
      font-size: 15px;
      min-width: 42px;
    }
    input[type="number"] {
      width: 100%;
      max-width: 94px;
      height: 42px;
      font-size: 1rem;
    }
    .movectrl {
      gap: 8px;
    }
    .movectrl button {
      font-size: 20px;
      flex: 0 1 42px;
    }
    .status {
      grid-column: 1 / -1;
      width: 100%;
      min-height: 52px;
    }
    .status-main {
      white-space: normal;
    }
    .solutionline {
      font-size: 1.08rem;
      min-height: 44px;
      padding-top: 12px;
      margin-top: 6px;
      margin-bottom: 6px;
    }
  }
  @media (max-width: 380px) {
    .topbar {
      grid-template-columns: 1fr 40px 40px;
      gap: 6px;
    }
    .control {
      gap: 6px;
      font-size: 1rem;
    }
    .movectrl {
      gap: 6px;
    }
    .solutionline {
      font-size: 1rem;
      line-height: 1.35;
    }
  }
</style>
</head>
<body tabindex="0">
<div class="reader">
  <div class="board-wrap">
    <div class="board" id="board" aria-label="Schachbrett"></div>
  </div>

  <div class="topbar">
    <div class="control">
      <label for="taskInput">Aufgabe:</label>
      <input id="taskInput" type="number" min="1" step="1" inputmode="numeric">
    </div>
    <button id="prevTaskBtn" title="Vorige Aufgabe">‹</button>
    <button id="nextTaskBtn" title="Nächste Aufgabe">›</button>
    <div class="status" id="statusText"></div>
  </div>

  <div class="solutionline hidden" id="solutionLine"></div>
  <div class="movectrl">
    <button id="startBtn" title="Anfangsstellung">|‹</button>
    <button id="prevMoveBtn" title="Zug zurück">‹</button>
    <button id="nextMoveBtn" title="Zug vor">›</button>
    <button id="endBtn" title="Endstellung">›|</button>
  </div>
</div>

1q2/3P4/2P2PP1/P2N2P1/1R4K1 b - - 0 3","k3r3/1r4pp/2Q2pn1/2Pp1q2/3P4/2P2PP1/P2N2P1/1R4K1 w - - 1 4","k3r3/1Q4pp/5pn1/2Pp1q2/3P4/2P2PP1/P2N2P1/1R4K1 b - - 0 4"],"sourceSolution":"1.¦xa6+ bxa6 (1...¢b8 2.¦a8#) 2.£xa6+ ¦a7 3.£xc6+ ¦b7 4.£xb7#","corrected":false},{"id":150,"fen":"8/p3q1k1/1p4b1/2p5/2P1p3/P2r1BP1/4Q3/4R1K1 w - - 0 1","moves":["Qxd3"],"positions":["8/p3q1k1/1p4b1/2p5/2P1p3/P2r1BP1/4Q3/4R1K1 w - - 0 1","8/p3q1k1/1p4b1/2p5/2P1p3/P2Q1BP1/8/4R1K1 b - - 0 1"],"sourceSolution":"1.£xd3 +-, Turmgewinn","corrected":false}];
const pieceImg = {
  P: "https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg",
  R: "https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg",
  N: "https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg",
  B: "https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg",
  Q: "https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg",
  K: "https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg",
  p: "https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg",
  r: "https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg",
  n: "https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg",
  b: "https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg",
  q: "https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg",
  k: "https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg"
};

const taskInput = document.getElementById('taskInput');
const boardEl = document.getElementById('board');
const solutionLineEl = document.getElementById('solutionLine');
const statusTextEl = document.getElementById('statusText');
const prevTaskBtn = document.getElementById('prevTaskBtn');
const nextTaskBtn = document.getElementById('nextTaskBtn');
const startBtn = document.getElementById('startBtn');
const prevMoveBtn = document.getElementById('prevMoveBtn');
const nextMoveBtn = document.getElementById('nextMoveBtn');
const endBtn = document.getElementById('endBtn');

const puzzleIds = puzzles.map(p => p.id).sort((a, b) => a - b);

let currentPuzzleId = Number(localStorage.getItem('schachtaktik-reader-puzzle') || puzzleIds[0]);
if (!Number.isFinite(currentPuzzleId) || !puzzleIds.includes(currentPuzzleId)) {
  currentPuzzleId = puzzleIds[0];
}

let currentStep = Number(localStorage.getItem('schachtaktik-reader-step') || 0);
if (!Number.isFinite(currentStep) || currentStep < 0) currentStep = 0;

let actionLockedUntil = 0;

function currentPuzzle() {
  return puzzles.find(p => p.id === currentPuzzleId) || puzzles[0];
}

function currentPuzzleIndex() {
  return puzzleIds.indexOf(currentPuzzleId);
}

function currentFen() {
  const puzzle = currentPuzzle();
  return puzzle.positions[Math.min(currentStep, puzzle.positions.length - 1)];
}

function puzzleOrientationIsBlack() {
  return isBlackToMove(currentPuzzle().fen);
}

function saveState() {
  localStorage.removeItem('schachtaktik-reader-theme');
  localStorage.setItem('schachtaktik-reader-puzzle', String(currentPuzzleId));
  localStorage.setItem('schachtaktik-reader-step', String(currentStep));
}

function expandFenBoard(fen) {
  const boardPart = fen.split(' ')[0];
  return boardPart.split('/').map(row => {
    const out = [];
    for (const ch of row) {
      if (/\d/.test(ch)) {
        for (let i = 0; i < Number(ch); i++) out.push('.');
      } else {
        out.push(ch);
      }
    }
    return out;
  });
}

function isBlackToMove(fen) {
  return fen.split(' ')[1] === 'b';
}

function renderBoard() {
  const fen = currentFen();
  const board = expandFenBoard(fen);
  const flipped = puzzleOrientationIsBlack();

  boardEl.innerHTML = '';
  for (let viewY = 0; viewY < 8; viewY++) {
    for (let viewX = 0; viewX < 8; viewX++) {
      const boardX = flipped ? 7 - viewX : viewX;
      const boardY = flipped ? 7 - viewY : viewY;

      const sq = document.createElement('div');
      sq.className = 'sq ' + (((viewX + viewY) % 2 === 0) ? 'light' : 'dark');

      if (viewY === 7) {
        const f = document.createElement('span');
        f.className = 'coord-file';
        f.textContent = flipped ? 'hgfedcba'[viewX] : 'abcdefgh'[viewX];
        sq.appendChild(f);
      }
      if (viewX === 0) {
        const r = document.createElement('span');
        r.className = 'coord-rank';
        r.textContent = flipped ? String(viewY + 1) : String(8 - viewY);
        sq.appendChild(r);
      }

      const piece = board[boardY][boardX];
      if (piece !== '.') {
        const img = document.createElement('img');
        img.className = 'piece';
        img.alt = '';
        img.src = pieceImg[piece];
        sq.appendChild(img);
      }
      boardEl.appendChild(sq);
    }
  }
}


function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function sourceSolutionToHtml(text) {
  return escapeHtml(text)
    .replace(/¢/g, '<img class="figurine" src="' + pieceImg.K + '" alt="">')
    .replace(/£/g, '<img class="figurine" src="' + pieceImg.Q + '" alt="">')
    .replace(/¦/g, '<img class="figurine" src="' + pieceImg.R + '" alt="">')
    .replace(/¥/g, '<img class="figurine" src="' + pieceImg.B + '" alt="">')
    .replace(/¤/g, '<img class="figurine" src="' + pieceImg.N + '" alt="">');
}

function renderSolutionLine() {
  const puzzle = currentPuzzle();
  if (currentStep === puzzle.moves.length && puzzle.sourceSolution) {
    solutionLineEl.className = 'solutionline';
    solutionLineEl.innerHTML = sourceSolutionToHtml(puzzle.sourceSolution);
  } else {
    solutionLineEl.className = 'solutionline';
    solutionLineEl.textContent = 'Die Lösung wird nach dem Durchklicken der Züge angezeigt.';
  }
}

function sideToMoveLabel(fen) {
  return isBlackToMove(fen) ? 'Schwarz am Zug' : 'Weiß am Zug';
}

function syncTaskInput() {
  taskInput.value = String(currentPuzzleId);
}

function renderStatus() {
  const isBlack = currentPuzzle().fen.split(' ')[1] === 'b';
  statusTextEl.classList.toggle('black-turn', isBlack);
  statusTextEl.classList.toggle('white-turn', !isBlack);
  statusTextEl.innerHTML = `<span class="status-main"><span class="status-dot" aria-hidden="true"></span>${isBlack ? 'Schwarz am Zug' : 'Weiß am Zug'}</span>
  `;
}

function clampStep() {
  currentStep = Math.max(0, Math.min(currentStep, currentPuzzle().moves.length));
}

function updateButtonStates() {
  const puzzle = currentPuzzle();
  const index = currentPuzzleIndex();
  prevTaskBtn.disabled = index <= 0;
  nextTaskBtn.disabled = index >= puzzleIds.length - 1;
  startBtn.disabled = currentStep <= 0;
  prevMoveBtn.disabled = currentStep <= 0;
  nextMoveBtn.disabled = currentStep >= puzzle.moves.length;
  endBtn.disabled = currentStep >= puzzle.moves.length;
}

function renderAll() {
  clampStep();
  syncTaskInput();
  renderBoard();
  renderSolutionLine();
  renderStatus();
  updateButtonStates();
  saveState();
}

function setPuzzleById(id) {
  if (!puzzleIds.includes(id)) {
    syncTaskInput();
    return;
  }
  if (id !== currentPuzzleId) {
    currentPuzzleId = id;
    currentStep = 0;
  }
  renderAll();
}

function changePuzzleBy(offset) {
  const next = currentPuzzleIndex() + offset;
  if (next < 0 || next >= puzzleIds.length) return;
  currentPuzzleId = puzzleIds[next];
  currentStep = 0;
  renderAll();
}

function stepToStart() {
  if (currentStep === 0) return;
  currentStep = 0;
  renderAll();
}

function stepBackward() {
  if (currentStep <= 0) return;
  currentStep -= 1;
  renderAll();
}

function stepForward() {
  if (currentStep >= currentPuzzle().moves.length) return;
  currentStep += 1;
  renderAll();
}

function stepToEnd() {
  const lastStep = currentPuzzle().moves.length;
  if (currentStep === lastStep) return;
  currentStep = lastStep;
  renderAll();
}

function withButtonDebounce(action, delay = 160) {
  return (ev) => {
    if (ev) ev.preventDefault();
    const now = Date.now();
    if (now < actionLockedUntil) return;
    actionLockedUntil = now + delay;
    action();
  };
}

function commitTaskInput() {
  const value = Number(taskInput.value);
  if (!Number.isFinite(value) || !puzzleIds.includes(value)) {
    syncTaskInput();
    return;
  }
  setPuzzleById(value);
  document.body.focus();
}

taskInput.addEventListener('change', commitTaskInput);
taskInput.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') {
    commitTaskInput();
    ev.preventDefault();
  } else if (ev.key === 'Escape') {
    syncTaskInput();
    document.body.focus();
    ev.preventDefault();
  }
});

prevTaskBtn.addEventListener('click', withButtonDebounce(() => changePuzzleBy(-1)));
nextTaskBtn.addEventListener('click', withButtonDebounce(() => changePuzzleBy(1)));
startBtn.addEventListener('click', withButtonDebounce(stepToStart));
prevMoveBtn.addEventListener('click', withButtonDebounce(stepBackward));
nextMoveBtn.addEventListener('click', withButtonDebounce(stepForward));
endBtn.addEventListener('click', withButtonDebounce(stepToEnd));

document.addEventListener('keydown', (ev) => {
  if (document.activeElement === taskInput) return;

  if (ev.key === 'ArrowRight') {
    stepForward();
    ev.preventDefault();
  } else if (ev.key === 'ArrowLeft') {
    stepBackward();
    ev.preventDefault();
  } else if (ev.key === 'Home') {
    stepToStart();
    ev.preventDefault();
  } else if (ev.key === 'End') {
    stepToEnd();
    ev.preventDefault();
  } else if (ev.key === 'ArrowUp') {
    changePuzzleBy(-1);
    ev.preventDefault();
  } else if (ev.key === 'ArrowDown') {
    changePuzzleBy(1);
    ev.preventDefault();
  }
});

window.addEventListener('load', () => {
  renderAll();
  document.body.focus();
});

document.addEventListener('click', (ev) => {
  if (ev.target !== taskInput) {
    document.body.focus();
  }
});
</script>
