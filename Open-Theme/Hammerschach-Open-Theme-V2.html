      let html = '';
      if(sanLine){
        html += '<div class="theme-info-line"><strong>Vorgegebene Zugfolge:</strong><br>' + escapeHtml(sanLine) + '</div>';
      }
      let hasContent = false;
      for(const item of sections){
        const label = item[0], key = item[1];
        const value = h[key];
        if(value && String(value).trim()){
          hasContent = true;
          html += '<section class="theme-info-section"><h4>' + escapeHtml(label) + '</h4><p>' + escapeHtml(value) + '</p></section>';
        }
      }
      if(!hasContent){
        html += '<section class="theme-info-section"><h4>Noch kein Lerntext hinterlegt</h4><p>Für diese Eröffnung enthält die PGN.txt noch keine Felder wie ThemeIdea, ThemeMoves, WhitePlan oder BlackPlan.</p></section>';
      }
      return {title:'📖 ' + title, html:html};
    }
    function openThemeInfoOverlay(){
      const backdrop = document.getElementById('themeInfoBackdrop');
      const body = document.getElementById('themeInfoBody');
      const title = document.getElementById('themeInfoTitle');
      if(!backdrop || !body || !title) return;
      const built = buildThemeInfoHtml(getCurrentOpeningHeaders());
      title.textContent = built.title;
      body.innerHTML = built.html;
      backdrop.classList.add('is-open');
      backdrop.setAttribute('aria-hidden','false');
      const closeBtn = document.getElementById('themeInfoClose');
      if(closeBtn) closeBtn.focus();
    }
    function closeThemeInfoOverlay(){
      const backdrop = document.getElementById('themeInfoBackdrop');
      if(!backdrop) return;
      backdrop.classList.remove('is-open');
      backdrop.setAttribute('aria-hidden','true');
    }

    function renderMoveList(){
      if(!movesPreEl) return;
      const themeName = readInputValue('hdrOpeningTheme') || '?';
      if(!Array.isArray(masterHistory) || masterHistory.length === 0){
        movesPreEl.innerHTML = '<div class="theme-note"><strong>Noch keine Eröffnung geladen.</strong><br>Lege eine PGN.txt in denselben Ordner oder wähle später eine Eröffnung aus der Liste.</div>';
        writeInputValue('hdrPlyCount','0');
        return;
      }
      const gtmp = new Game();
      const entries = [];
      for(let i=0;i<masterHistory.length;i++){
        const mv = masterHistory[i]; if(!mv) continue;
        const san = buildSANForMove(gtmp, mv); gtmp.makeMove(mv);
        entries.push({ index:i, moveNo:(i>>1)+1, color:(i%2===0)?'w':'b', san });
      }
      const fullMoves = [];
      for(let i=0;i<entries.length;){
        const num = entries[i].moveNo;
        const fm = { no:num, white:null, black:null };
        if(entries[i].color === 'w'){
          fm.white = entries[i++];
          if(i < entries.length && entries[i].moveNo === num && entries[i].color === 'b') fm.black = entries[i++];
        } else fm.black = entries[i++];
        fullMoves.push(fm);
      }
      function renderNumCell(moveObj){ return moveObj ? '<div class="mv-num">' + moveObj.no + '.</div>' : '<div class="mv-num"></div>'; }
      function renderMoveCell(entry){
        if(!entry) return '<div class="mv-cell"></div>';
        const isActive = (viewIndex - 1) === entry.index;
        const isTheme = entry.index < themeStartPly;
        const isThemeEnd = themeStartPly > 0 && entry.index === themeStartPly - 1;
        const cls = 'mv' + (isActive ? ' active' : '') + (isTheme ? ' theme-move' : '') + (isThemeEnd ? ' theme-end' : '');
        const titleText = isTheme ? 'Vorgegebener Eröffnungszug' : 'Vereinszug';
        const title = entry.san ? ' title="' + titleText + ': ' + entry.san.replace(/"/g,'&quot;') + '"' : '';
        return '<div class="mv-cell"><span class="' + cls + '" data-idx="' + entry.index + '"' + title + '>' + entry.san + '</span></div>';
      }
      const playerPly = Math.max(0, masterHistory.length - themeStartPly);
      let html = '<div class="theme-note"><strong>' + themeName + '</strong><br>Vorgegebene Eröffnung: ' + themeStartPly + ' Halbzüge. Nachgespielte Vereinszüge: ' + playerPly + ' Halbzüge.</div>';
      html += '<div class="mv-table">';
      for(let i=0;i<fullMoves.length;i+=2){
        const left = fullMoves[i];
        const right = (i+1 < fullMoves.length) ? fullMoves[i+1] : null;
        html += '<div class="mv-row">';
        html += renderNumCell(left) + renderMoveCell(left && left.white) + renderMoveCell(left && left.black);
        if(right) html += renderNumCell(right) + renderMoveCell(right.white) + renderMoveCell(right.black);
        else html += '<div class="mv-num"></div><div class="mv-cell"></div><div class="mv-cell"></div>';
        html += '</div>';
      }
      html += '</div>';
      movesPreEl.innerHTML = html;
      writeInputValue('hdrThemeStartPly', String(themeStartPly || 0));
      writeInputValue('hdrPlyCount', String(masterHistory.length));
    }
    if(movesPreEl){
      movesPreEl.addEventListener('click', (e) => {
        const el = e.target.closest('.mv');
        if(!el) return;
        const idx = Number(el.dataset.idx);
        if(!Number.isFinite(idx)) return;
        selected = null;
        viewIndex = idx + 1;
        renderBoardFromView();
      });
    }

    const btnStart = document.getElementById('btnStart');
    const btnBack = document.getElementById('btnBack');
    const btnForward = document.getElementById('btnForward');
    const btnEnd = document.getElementById('btnEnd');
    const btnUndo = document.getElementById('btnUndo');
    const btnFlip = document.getElementById('btnFlip');
    const btnSave = document.getElementById('btnSave');
    const btnThemeInfo = document.getElementById('btnThemeInfo');
    const btnShowList = document.getElementById('btnShowList');
    const btnRandomOpening = document.getElementById('btnRandomOpening');

    function navAction(fn){ selected = null; clearMoveTargets(); fn(); renderBoardFromView(); }
    btnStart.addEventListener('click', () => navAction(() => { viewIndex = 0; }));
    btnEnd.addEventListener('click', () => navAction(() => { viewIndex = masterHistory.length; }));
    btnBack.addEventListener('click', () => navAction(() => { if(viewIndex > 0) viewIndex--; }));
    btnForward.addEventListener('click', () => navAction(() => { if(viewIndex < masterHistory.length) viewIndex++; }));
    btnUndo.addEventListener('click', () => navAction(() => {
      if(masterHistory.length <= themeStartPly){ viewIndex = masterHistory.length; return; }
      if(viewIndex < masterHistory.length) masterHistory.splice(Math.max(viewIndex, themeStartPly));
      else masterHistory.pop();
      if(masterHistory.length < themeStartPly) masterHistory.length = themeStartPly;
      viewIndex = masterHistory.length; persistCurrentGame();
    }));
    btnFlip.addEventListener('click', () => { orientationWhite = !orientationWhite; persistCurrentGame(); renderBoardFromView(); });
    btnSave.addEventListener('click', saveCurrentGame);
    if(btnThemeInfo) btnThemeInfo.addEventListener('click', openThemeInfoOverlay);
    const themeInfoCloseBtn = document.getElementById('themeInfoClose');
    if(themeInfoCloseBtn) themeInfoCloseBtn.addEventListener('click', closeThemeInfoOverlay);
    btnShowList.addEventListener('click', openGameListModal);
    btnRandomOpening.addEventListener('click', selectRandomOpening);

    document.addEventListener('keydown', (e) => {
      const active = document.activeElement;
      if(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) return;
      if(e.key === 'Home') btnStart.click();
      if(e.key === 'End') btnEnd.click();
      if(e.key === 'ArrowLeft') btnBack.click();
      if(e.key === 'ArrowRight') btnForward.click();
      if(e.key.toLowerCase() === 'u') btnUndo.click();
      if(e.key.toLowerCase() === 'f') btnFlip.click();
      if(e.key === 'Escape'){
        removePromotionOverlay();
        closeThemeInfoOverlay();
      }
    });

    const engineStatusEl = document.getElementById('engineStatus');
    const chkAutoAnalyse = document.getElementById('chkAutoAnalyse');
    const btnAnalyse = document.getElementById('btnAnalyse');
    const btnStopAnalyse = document.getElementById('btnStopAnalyse');
    const engineModeEl = document.getElementById('engineMode');
    const engineDepthWrapEl = document.getElementById('engineDepthWrap');
    const engineMoveTimeWrapEl = document.getElementById('engineMoveTimeWrap');
    const engineDepthEl = document.getElementById('engineDepth');
    const engineMoveTimeEl = document.getElementById('engineMoveTime');
    const engineMultiPVEl = document.getElementById('engineMultiPV');
    const engineEvalEl = document.getElementById('engineEval');
    const engineDepthOutEl = document.getElementById('engineDepthOut');
    const engineNpsEl = document.getElementById('engineNps');
    const engineWdlEl = document.getElementById('engineWdl');
    const engineBestMoveEl = document.getElementById('engineBestMove');
    const enginePvListEl = document.getElementById('enginePvList');

    const engineState = {
      worker:null, ready:false, uciOk:false, analyzing:false, pendingRequest:null,
      activeKey:'', lastCompletedKey:'', infoByPv:new Map(), bestmoveUci:null,
      bestmoveMove:null, bestmoveFen:null, bestmoveSan:null, analysisFen:null,
      analysisGame:null, mode:'depth'
    };

    function formatNumberDE(num){ try { return new Intl.NumberFormat('de-DE').format(num); } catch(e){ return String(num); } }
    function updateEngineStatus(msg){ if(engineStatusEl) engineStatusEl.textContent = msg || '–'; }
    function updateEngineModeVisibility(){
      const mode = engineModeEl ? engineModeEl.value : 'depth';
      engineDepthWrapEl.classList.toggle('is-hidden', mode !== 'depth');
      engineMoveTimeWrapEl.classList.toggle('is-hidden', mode !== 'movetime');
    }
    function updateEngineControlVisibility(){
      const autoEnabled = !!(chkAutoAnalyse && chkAutoAnalyse.checked);
      const isSearching = !!engineState.analyzing;
      btnAnalyse.classList.toggle('is-hidden', autoEnabled);
      btnStopAnalyse.classList.toggle('is-hidden', !isSearching);
    }
    function clearEngineInfo(keepBestMove){
      engineState.infoByPv = new Map();
      if(!keepBestMove){
        engineState.bestmoveUci = null; engineState.bestmoveMove = null; engineState.bestmoveFen = null; engineState.bestmoveSan = null;
      }
      renderEngineInfo();
    }
    function engineSend(line){ if(engineState.worker && line) engineState.worker.postMessage(line); }
    async function initEngine(){
      if(engineState.worker){ try { engineState.worker.terminate(); } catch(e){} }
      clearEngineInfo(false);
      engineState.ready = false; engineState.uciOk = false; engineState.analyzing = false; engineState.pendingRequest = null; engineState.activeKey = ''; engineState.lastCompletedKey = '';
      updateEngineStatus('Engine wird geladen…');
      updateEngineControlVisibility();
      try {
        const [jsResp, wasmResp] = await Promise.all([
          fetch('stockfish.js', {cache:'no-store'}),
          fetch('stockfish.wasm', {cache:'no-store'})
        ]);
        if(!jsResp.ok) throw new Error('stockfish.js nicht erreichbar (' + jsResp.status + ')');
        if(!wasmResp.ok) throw new Error('stockfish.wasm nicht erreichbar (' + wasmResp.status + ')');
      } catch(err){
        console.error('Engine-Dateien nicht erreichbar:', err);
        updateEngineStatus('Dateien nicht erreichbar');
        enginePvListEl.innerHTML = 'stockfish.js oder stockfish.wasm ist unter der veröffentlichten URL nicht erreichbar.';
        return;
      }
      try { engineState.worker = new Worker('stockfish.js'); }
      catch(err){
        console.error(err);
        updateEngineStatus('Worker konnte nicht geladen werden');
        enginePvListEl.innerHTML = 'Die Engine-Dateien konnten nicht als Web Worker geladen werden.';
        return;
      }
      const startupTimer = setTimeout(() => {
        if(!engineState.uciOk){
          updateEngineStatus('Keine Antwort vom Worker');
          enginePvListEl.innerHTML = 'Der Worker hat nicht auf den UCI-Handshake geantwortet. Bitte Browser-Konsole prüfen.';
        }
      }, 5000);
      engineState.worker.onmessage = ev => {
        if(!engineState.uciOk && String(ev.data || '').trim()) clearTimeout(startupTimer);
        handleEngineLine(String(ev.data || '').trim());
      };
      engineState.worker.onerror = err => {
        console.error('Engine-Fehler:', err);
        updateEngineStatus('Engine-Fehler');
        enginePvListEl.innerHTML = 'Worker-Fehler: ' + (err && err.message ? err.message : 'unbekannt');
      };
      engineSend('uci');
    }
    function configureEngineOptions(){
      const multiPv = Math.max(1, Math.min(4, parseInt(engineMultiPVEl.value, 10) || 1));
      engineSend('setoption name UCI_ShowWDL value true');
      engineSend('setoption name MultiPV value ' + multiPv);
      const threads = Math.max(1, Math.min(8, Number(navigator.hardwareConcurrency) || 1));
      engineSend('setoption name Threads value ' + threads);
      engineSend('setoption name Hash value 64');
    }
    function currentEngineRequest(force){
      const g = buildGameFromHistory(viewIndex);
      const fen = gameToFEN(g);
      if(!fen) return null;
      const mode = engineModeEl.value;
      const depth = Math.max(1, Math.min(99, parseInt(engineDepthEl.value, 10) || 18));
      const movetime = Math.max(50, Math.min(600000, parseInt(engineMoveTimeEl.value, 10) || 1200));
      const multiPv = Math.max(1, Math.min(4, parseInt(engineMultiPVEl.value, 10) || 1));
      const key = [fen, mode, depth, movetime, multiPv].join('|');
      return { fen, game:g.clone(), mode, depth, movetime, multiPv, key, force:!!force };
    }
    function requestEngineAnalysis(force){
      if(!engineState.worker) return;
      if(!engineState.ready){ updateEngineStatus('Engine startet…'); return; }
      if(!chkAutoAnalyse.checked && !force) return;
      const req = currentEngineRequest(force);
      if(!req) return;
      const sameAsActive = engineState.analyzing && engineState.activeKey === req.key;
      const sameAsFinished = !force && !engineState.analyzing && engineState.lastCompletedKey === req.key;
      if(sameAsActive || sameAsFinished) return;
      engineState.pendingRequest = req;
      if(engineState.analyzing){ updateEngineStatus('Suche wird aktualisiert…'); engineSend('stop'); return; }
      startPendingEngineRequest();
    }
    function startPendingEngineRequest(){
      if(!engineState.ready || engineState.analyzing || !engineState.pendingRequest) return;
      const req = engineState.pendingRequest;
      engineState.pendingRequest = null;
      engineState.activeKey = req.key;
      engineState.analyzing = true;
      updateEngineControlVisibility();
      engineState.mode = req.mode;
      engineState.analysisFen = req.fen;
      engineState.analysisGame = req.game ? req.game.clone() : null;
      clearEngineInfo(false);
      updateEngineStatus('Suche läuft…');
      configureEngineOptions();
      engineSend('position fen ' + req.fen);
      if(req.mode === 'movetime') engineSend('go movetime ' + req.movetime);
      else engineSend('go depth ' + req.depth);
    }
    function stopEngineAnalysis(clearPending){
      if(clearPending) engineState.pendingRequest = null;
      if(engineState.analyzing){ updateEngineStatus('Suche wird gestoppt…'); engineSend('stop'); }
      else if(clearPending) updateEngineStatus(engineState.ready ? 'Bereit' : 'Engine wird geladen…');
      updateEngineControlVisibility();
    }
    function handleEngineLine(line){
      if(!line) return;
      if(line === 'uciok'){ engineState.uciOk = true; configureEngineOptions(); engineSend('isready'); updateEngineStatus('Engine meldet sich…'); return; }
      if(line === 'readyok'){ engineState.ready = true; updateEngineStatus('Bereit'); updateEngineControlVisibility(); requestEngineAnalysis(true); return; }
      if(line.startsWith('info ')){ parseEngineInfo(line); return; }
      if(line.startsWith('bestmove ')){ handleBestMove(line); return; }
    }
    function parseEngineInfo(line){
      const tokens = line.split(/\s+/);
      const info = { raw: line };
      for(let i=1;i<tokens.length;i++){
        const t = tokens[i];
        if(t === 'depth' && i + 1 < tokens.length) info.depth = parseInt(tokens[++i], 10);
        else if(t === 'seldepth' && i + 1 < tokens.length) info.seldepth = parseInt(tokens[++i], 10);
        else if(t === 'multipv' && i + 1 < tokens.length) info.multipv = parseInt(tokens[++i], 10);
        else if(t === 'nodes' && i + 1 < tokens.length) info.nodes = parseInt(tokens[++i], 10);
        else if(t === 'nps' && i + 1 < tokens.length) info.nps = parseInt(tokens[++i], 10);
        else if(t === 'hashfull' && i + 1 < tokens.length) info.hashfull = parseInt(tokens[++i], 10);
        else if(t === 'time' && i + 1 < tokens.length) info.time = parseInt(tokens[++i], 10);
        else if(t === 'score' && i + 2 < tokens.length){
          const type = tokens[++i]; const val = parseInt(tokens[++i], 10);
          if(type === 'cp') info.scoreCp = val;
          if(type === 'mate') info.scoreMate = val;
        } else if(t === 'wdl' && i + 3 < tokens.length){
          info.wdl = [parseInt(tokens[++i], 10), parseInt(tokens[++i], 10), parseInt(tokens[++i], 10)];
        } else if(t === 'pv') { info.pv = tokens.slice(i + 1); break; }
      }
      const mpv = info.multipv || 1;
      const prev = engineState.infoByPv.get(mpv) || {};
      engineState.infoByPv.set(mpv, Object.assign({}, prev, info));
      renderEngineInfo();
    }
    function algToCoord(alg){
      if(!alg || alg.length < 2) return null;
      const x = 'abcdefgh'.indexOf(alg[0]);
      const rank = parseInt(alg[1], 10);
      if(x < 0 || !Number.isFinite(rank) || rank < 1 || rank > 8) return null;
      return [x, 8 - rank];
    }
    function moveToSAN(gameBefore, mv){ return buildSANForMove(gameBefore, mv); }
    function parseUciMove(game, uci){
      if(!game || !uci || uci.length < 4) return null;
      const from = algToCoord(uci.slice(0,2));
      const to = algToCoord(uci.slice(2,4));
      const promo = uci.length >= 5 ? uci[4].toLowerCase() : null;
      if(!from || !to) return null;
      const legal = game.legalMoves();
      for(const mv of legal){
        if(mv.from[0] !== from[0] || mv.from[1] !== from[1]) continue;
        if(mv.to[0] !== to[0] || mv.to[1] !== to[1]) continue;
        const copy = {from:[mv.from[0],mv.from[1]], to:[mv.to[0],mv.to[1]], meta:Object.assign({}, mv.meta || {})};
        if(promo){ copy.meta.promote = promo; copy.promotion = promo.toUpperCase(); }
        return copy;
      }
      return null;
    }
    function pvToSanString(pvMoves, game, maxMoves){
      if(!pvMoves || !pvMoves.length || !game) return '';
      const sim = game.clone();
      const out = [];
      const limit = Math.max(1, maxMoves || 8);
      for(let i=0;i<pvMoves.length && i<limit;i++){
        const raw = pvMoves[i];
        const mv = parseUciMove(sim, raw);
        if(!mv){ out.push(raw); break; }
        out.push(moveToSAN(sim, mv) || raw);
        sim.makeMove(mv);
      }
      return out.join(' ');
    }
    function formatScore(info){
      if(!info) return '–';
      if(typeof info.scoreMate === 'number') return '#' + info.scoreMate;
      if(typeof info.scoreCp === 'number'){
        const cp = info.scoreCp / 100;
        return (cp > 0 ? '+' : '') + cp.toFixed(2);
      }
      return '–';
    }
    function formatBestMoveForDisplay(){
      if(!engineState.bestmoveUci) return '–';
      if(engineState.bestmoveSan) return engineState.bestmoveSan + ' (' + engineState.bestmoveUci + ')';
      return engineState.bestmoveUci;
    }
    function renderEngineInfo(){
      const main = engineState.infoByPv.get(1) || null;
      engineEvalEl.textContent = formatScore(main);
      engineDepthOutEl.textContent = main && typeof main.depth === 'number' ? String(main.depth) : '–';
      engineNpsEl.textContent = main && typeof main.nps === 'number' ? formatNumberDE(main.nps) : '–';
      engineWdlEl.textContent = main && main.wdl ? main.wdl.join(' / ') : '–';
      engineBestMoveEl.textContent = formatBestMoveForDisplay();
      const entries = Array.from(engineState.infoByPv.entries()).sort((a,b)=>a[0]-b[0]);
      if(!entries.length){ enginePvListEl.innerHTML = engineState.analyzing ? 'Analyse läuft…' : 'Noch keine Analyse.'; return; }
      const g = engineState.analysisGame ? engineState.analysisGame.clone() : buildGameFromHistory(viewIndex);
      let html = '';
      for(const [idx, info] of entries){
        const pvSan = pvToSanString(info.pv || [], g, 10);
        html += '<div class="pv-row' + (idx === 1 ? ' main' : '') + '">';
        html += '<div class="pv-meta"><span>#' + idx + '</span></div>';
        html += '<div class="pv-line">' + (pvSan || (info.pv || []).join(' ') || '–') + '</div>';
        html += '</div>';
      }
      enginePvListEl.innerHTML = html;
    }
    function handleBestMove(line){
      const parts = line.split(/\s+/);
      const uci = parts[1] && parts[1] !== '(none)' ? parts[1] : null;
      engineState.analyzing = false;
      engineState.lastCompletedKey = engineState.activeKey || engineState.lastCompletedKey;
      const g = engineState.analysisGame ? engineState.analysisGame.clone() : buildGameFromHistory(viewIndex);
      const fen = engineState.analysisFen || gameToFEN(g);
      engineState.bestmoveUci = uci;
      engineState.bestmoveFen = fen;
      engineState.bestmoveMove = uci ? parseUciMove(g, uci) : null;
      engineState.bestmoveSan = engineState.bestmoveMove ? moveToSAN(g, engineState.bestmoveMove) : null;
      updateEngineStatus(engineState.ready ? 'Bereit' : 'Engine wird geladen…');
      updateEngineControlVisibility();
      renderEngineInfo();
      renderBoardFromView();
      startPendingEngineRequest();
    }
    function setupEngineControls(){
      updateEngineModeVisibility();
      updateEngineControlVisibility();
      btnAnalyse.addEventListener('click', () => requestEngineAnalysis(true));
      btnStopAnalyse.addEventListener('click', () => stopEngineAnalysis(true));
      engineModeEl.addEventListener('change', () => { updateEngineModeVisibility(); requestEngineAnalysis(true); });
      [engineDepthEl, engineMoveTimeEl, engineMultiPVEl].forEach(el => el.addEventListener('change', () => requestEngineAnalysis(true)));
      chkAutoAnalyse.addEventListener('change', () => {
        updateEngineControlVisibility();
        if(chkAutoAnalyse.checked) requestEngineAnalysis(true);
        else stopEngineAnalysis(true);
      });
      window.addEventListener('beforeunload', () => { try { if(engineState.worker) engineState.worker.terminate(); } catch(e){} });
    }

    setupEngineControls();
    loadGameByIndex(0, false);
    loadOpeningThemesFromPGN();
    initEngine();
  </script>

  <script>
    (function(){
      function fitLayout(){
        try{
          var mgmt = document.querySelector('.mgmt');
          var controls = document.querySelector('.controls');
          var status = document.getElementById('status');
          var vpad = 24;
          var mgmtH = mgmt ? mgmt.offsetHeight : 0;
          var controlsH = controls ? controls.offsetHeight : 0;
          var statusH = status ? status.offsetHeight : 0;
          var avail = window.innerHeight - (mgmtH + controlsH + statusH + vpad + 40);
          var size = Math.max(320, Math.min(600, avail));
          if(!isFinite(size) || size < 320) size = 320;
          document.documentElement.style.setProperty('--board-size', size + 'px');
        } catch(e){ console.warn('fitLayout failed', e); }
      }
      window.addEventListener('resize', fitLayout);
      document.addEventListener('DOMContentLoaded', fitLayout);
      setTimeout(fitLayout, 120);
    })();
  </script>
</body>
