name = "hammerschach-gamer-lobby"
main = "src/index.js"
compatibility_date = "2026-06-26"
keep_vars = true
# Optionales Worker-Secret für die automatische Hammerschach-TV-Kanalsuche:
# YOUTUBE_API_KEY (nicht in diese Datei eintragen)

[vars]
GAMER_PUBLIC_URL = "https://hammerschach-gamer.webmaster-5bb.workers.dev/"
MAIL_LOGO_URL = "https://raw.githubusercontent.com/Andili3108/Hammerschach-Editor/main/Gamer/Gamer-Logo.png"

[triggers]
crons = ["17 3 * * *"]

[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoom" },
  { name = "GLOBAL_CHAT", class_name = "GlobalChat" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2-global-chat"
new_sqlite_classes = ["GlobalChat"]

[[d1_databases]]
binding = "DB"
database_name = "hammerschach-gamer-db"
database_id = "e6155132-6ad6-4569-be28-122540d3748f"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "hammerschach-gamer-avatars"
