<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matt-Player</title>
<style>
  :root {
    --light: #f0d9b5;
    --dark: #843f46;
    --frame: #2f2b28;
    --text: #1f1d1b;
    --muted: #6c6259;
    --panel: #fffdf9;
    --accent: #355c8a;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; margin: 0; padding: 0; background: transparent; color: var(--text); font-family: "Times New Roman", Times, serif; overflow-x: hidden; }
  body { padding: 10px 8px 14px; font-size: 18px; }
  .reader {
    --board-size: min(600px, 100%);
    width: var(--board-size);
    max-width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .topbar {
    width: 100%;
    max-width: 100%;
    display: grid;
    grid-template-columns: max-content max-content 52px 52px minmax(0, 192px);
    justify-content: center;
    align-items: center;
    gap: 10px 12px;
    min-height: 52px;
    padding: 4px 0 0;
  }
  .control {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 1.12rem;
    min-width: 0;
    white-space: nowrap;
  }
  label {
    white-space: nowrap;
  }
  select, button {
    font: inherit;
    border-radius: 10px;
    padding: 6px 10px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  select {
    border: 1px solid #b8ada2;
    max-width: 100%;
  }
  button {
    cursor: pointer;
    min-width: 52px;
    height: 52px;
    border: 1px solid #cfcfcf;
    background: #e6e6e6;
    color: #9A2D33;
    font-size: 18px;
    font-weight: 600;
    box-shadow: 0 2px 5px rgba(0,0,0,0.18);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: filter .15s ease, transform .05s ease;
  }
  button:hover {
    filter: brightness(1.02);
  }
  button:active {
    transform: translateY(1px);
  }
  select:hover { border-color: #8e8277; }
  .status {
    width: 100%;
    min-width: 0;
    min-height: 58px;
    padding: 8px 14px 8px 16px;
    border: 1px solid #cab9a8;
    border-radius: 14px;
    background: linear-gradient(180deg, #fffdf9 0%, #f5eee6 100%);
    box-shadow: 0 3px 8px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.8);
    color: var(--text);
    justify-self: center;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    overflow: hidden;
  }
  .status::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: #843f46;
    opacity: 0.9;
  }
  .status-hint {
    font-size: 0.78rem;
    line-height: 1;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7b6d60;
    font-weight: 700;
  }
  .status-main {
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    font-size: 1rem;
    line-height: 1.08;
    font-weight: 700;
    white-space: nowrap;
    text-align: left;
    padding-left: 4px;
  }
  .status-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 1px;
    text-align: left;
    line-height: 1.02;
  }
  .status-color {
    font-size: 0.98rem;
    font-weight: 700;
  }
  .status-move {
    font-size: 0.8rem;
    font-weight: 700;
    color: #5f5449;
  }
  .status-dot {
    width: 0.72em;
    height: 0.72em;
    border-radius: 50%;
    flex: 0 0 auto;
    border: 1px solid rgba(0,0,0,0.28);
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .status.white-turn .status-dot {
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f5f0e9 65%, #d7cbc0 100%);
  }
  .status.black-turn .status-dot {
    background: radial-gradient(circle at 35% 35%, #696969 0%, #2c2c2c 60%, #111111 100%);
    border-color: rgba(255,255,255,0.18);
  }
  .board-wrap {
    width: var(--board-size);
    max-width: 100%;
    display: flex;
    justify-content: center;
  }
  .board {
    width: 100%;
    aspect-ratio: 1 / 1;
    height: auto;
    border: 3px solid var(--frame);
    border-radius: 8px;
    overflow: hidden;
    display: grid;
    grid-template-columns: repeat(8,1fr);
    grid-template-rows: repeat(8,1fr);
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    background: #fff;
  }
  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sq.light { background: var(--light); }
  .sq.dark { background: var(--dark); }
  .piece {
    width: 82%;
    height: 82%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.22));
  }
  .coord-file, .coord-rank {
    position: absolute;
    font-size: 0.82rem;
    line-height: 1;
    font-weight: 700;
    opacity: 0.72;
    pointer-events: none;
    user-select: none;
  }
  .coord-file { right: 6px; bottom: 4px; }
  .coord-rank { left: 6px; top: 4px; }
  .sq.light .coord-file, .sq.light .coord-rank { color: rgba(90,52,28,0.8); }
  .sq.dark .coord-file, .sq.dark .coord-rank { color: rgba(255,244,226,0.88); }
  .figurine {
    width: 0.92em;
    height: 0.92em;
    vertical-align: -0.1em;
    margin: 0 0.03em;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.16));
  }
  .movectrl {
    width: var(--board-size);
    max-width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 4px;
  }
  .movectrl button {
    min-width: 52px;
    padding: 6px 14px;
    font-size: 24px;
    line-height: 1;
    letter-spacing: 0;
  }
  input[type="number"] {
    width: 58px;
    min-width: 58px;
    max-width: 58px;
    height: 52px;
    padding: 6px 8px;
    text-align: center;
    font-size: 1.12rem;
    line-height: 1;
    font-family: inherit;
    border: 1px solid #cfcfcf;
    border-radius: 10px;
    background: #fffdf9;
    color: var(--text);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] {
    appearance: textfield;
    -moz-appearance: textfield;
  }
  .solutionline {
    width: min(600px, var(--board-size));
    max-width: 100%;
    min-height: 52px;
    text-align: center;
    font-size: 1.18rem;
    font-weight: 700;
    line-height: 1.45;
    color: var(--text);
    padding: 18px 10px 0;
    margin-top: 8px;
    margin-bottom: 8px;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: normal;
  }
  .solutionline.hidden {
    visibility: hidden;
  }
  button:disabled {
    opacity: 0.68;
    cursor: default;
  }
  @media (max-width: 520px) {
    body { padding: 8px 6px 12px; font-size: 16px; }
    .reader { gap: 8px; }
    .topbar {
      gap: 8px;
      grid-template-columns: minmax(0, 1fr) 42px 42px;
      align-items: stretch;
      justify-content: stretch;
    }
    .control {
      min-width: 0;
    }
    input, button { padding: 4px 8px; }
    button {
      height: 42px;
      font-size: 15px;
      min-width: 42px;
    }
    input[type="number"] {
      width: 50px;
      min-width: 50px;
      max-width: 50px;
      height: 42px;
      font-size: 1rem;
      padding: 4px 6px;
    }
    .movectrl {
      gap: 8px;
    }
    .movectrl button {
      font-size: 20px;
      flex: 0 1 42px;
    }
    .status {
      grid-column: 1 / -1;
      width: 100%;
      min-height: 52px;
    }
    .status-main {
      gap: 8px;
      padding-left: 2px;
    }
    .status-color {
      font-size: 0.94rem;
    }
    .status-move {
      font-size: 0.78rem;
    }
    .solutionline {
      font-size: 1.08rem;
      min-height: 44px;
      padding-top: 12px;
      margin-top: 6px;
      margin-bottom: 6px;
    }
  }
  @media (max-width: 380px) {
    .topbar {
      grid-template-columns: 1fr 40px 40px;
      gap: 6px;
    }
    .control {
      gap: 6px;
      font-size: 1rem;
    }
    .movectrl {
      gap: 6px;
    }
    .solutionline {
      font-size: 1rem;
      line-height: 1.35;
    }
  }
</style>
</head>

function solutionTokenCandidates(sourceSolution) {
  let text = sourceSolution;
  while (/\([^()]*\)/.test(text)) {
    text = text.replace(/\([^()]*\)/g, ' ');
  }
  text = text.replace(/[\[\]]/g, ' ');
  text = text.replace(/[–—]/g, '-');
  for (const [from, to] of Object.entries(figurineToSanMap)) {
    text = text.split(from).join(to);
  }
  const rawTokens = text.split(/\s+/);
  const tokens = [];
  for (let token of rawTokens) {
    token = token.trim().replace(/^[,;]+|[,;]+$/g, '');
    if (!token) continue;
    if (/^\d+\.(\.\.)?$/.test(token)) continue;
    token = token.replace(/^\d+\.(\.\.)?/, '').replace(/^[,;]+|[,;]+$/g, '');
    if (!token) continue;
    if (/^(1-0|0-1|1\/2-1\/2)$/.test(token)) continue;
    token = token.replace(/([a-h][18])N([+#]?)$/, '$1=N$2');
    tokens.push(token);
  }
  return tokens;
}

const sanToFigurineMap = {
  Q: '£',
  R: '¦',
  B: '¥',
  N: '¤',
  K: '¢'
};

function sanToFigurineText(san) {
  return san
    .replace(/^([KQRBN])/, (_, piece) => sanToFigurineMap[piece] || piece)
    .replace(/=([QRBN])/g, (_, piece) => '=' + (sanToFigurineMap[piece] || piece));
}

function buildDisplaySolution(moves, sideToMove) {
  if (!moves.length) return '';
  const parts = [];
  if (sideToMove === 'w') {
    for (let i = 0; i < moves.length; i += 2) {
      parts.push(`${(i / 2) + 1}.${sanToFigurineText(moves[i])}`);
      if (i + 1 < moves.length) {
        parts.push(sanToFigurineText(moves[i + 1]));
      }
    }
  } else {
    parts.push(`1...${sanToFigurineText(moves[0])}`);
    let moveNo = 2;
    for (let i = 1; i < moves.length; i += 2) {
      parts.push(`${moveNo}.${sanToFigurineText(moves[i])}`);
      if (i + 1 < moves.length) {
        parts.push(`${moveNo}...${sanToFigurineText(moves[i + 1])}`);
      }
      moveNo += 1;
    }
  }
  return parts.join(' ');
}

function extractPlayableSanMoves(sourceSolution, startFen) {
  const candidates = solutionTokenCandidates(sourceSolution);
  const chess = new Chess(startFen);
  const appliedMoves = [];
  const positions = [startFen];
  for (const token of candidates) {
    const move = chess.move(token, { sloppy: true });
    if (!move) continue;
    appliedMoves.push(move.san);
    positions.push(chess.fen());
    if (chess.in_checkmate()) break;
  }
  return { moves: appliedMoves, positions };
}

function buildRuntimePuzzle(puzzle) {
  const base = { ...puzzle, moves: [], positions: [puzzle.fen], displaySolution: puzzle.sourceSolution };
  if (typeof Chess === 'undefined') {
    console.warn('chess.js konnte nicht geladen werden. Nur die Ausgangsstellung wird angezeigt.');
    return base;
  }
  const parsed = extractPlayableSanMoves(puzzle.sourceSolution, puzzle.fen);
  return {
    ...puzzle,
    moves: parsed.moves,
    positions: parsed.positions,
    displaySolution: buildDisplaySolution(parsed.moves, puzzle.fen.split(' ')[1])
  };
}

function buildRuntimePuzzleGroups() {
  return Object.fromEntries(
    categoryOrder.map(category => [
      category,
      puzzleGroups[category].map(buildRuntimePuzzle)
    ])
  );
}

const runtimePuzzleGroups = buildRuntimePuzzleGroups();

function getPuzzleIds(category) {
  return runtimePuzzleGroups[category].map(p => p.id).sort((a, b) => a - b);
}

let currentCategory = localStorage.getItem('schachtaktik-reader-category') || categoryOrder[0];
if (!categoryOrder.includes(currentCategory)) {
  currentCategory = categoryOrder[0];
}

let currentPuzzleId = Number(localStorage.getItem('schachtaktik-reader-puzzle') || getPuzzleIds(currentCategory)[0]);
if (!Number.isFinite(currentPuzzleId) || !getPuzzleIds(currentCategory).includes(currentPuzzleId)) {
  currentPuzzleId = getPuzzleIds(currentCategory)[0];
}

let currentStep = Number(localStorage.getItem('schachtaktik-reader-step') || 0);
if (!Number.isFinite(currentStep) || currentStep < 0) currentStep = 0;

let actionLockedUntil = 0;
const actionDebounceMs = 180;
const controlLockedUntil = new Map();

function runGuardedAction(key, fn) {
  const now = Date.now();
  if (now < (controlLockedUntil.get(key) || 0)) return;
  controlLockedUntil.set(key, now + actionDebounceMs);
  fn();
}

function blurControl(el) {
  if (el && typeof el.blur === 'function') el.blur();
}

function activePuzzles() {
  return runtimePuzzleGroups[currentCategory];
}

function currentPuzzle() {
  return activePuzzles().find(p => p.id === currentPuzzleId) || activePuzzles()[0];
}

function currentPuzzleIndex() {
  return getPuzzleIds(currentCategory).indexOf(currentPuzzleId);
}

function currentFen() {
  const puzzle = currentPuzzle();
  return puzzle.positions[Math.min(currentStep, puzzle.positions.length - 1)];
}

function puzzleOrientationIsBlack() {
  return isBlackToMove(currentPuzzle().fen);
}

function saveState() {
  localStorage.removeItem('schachtaktik-reader-theme');
  localStorage.setItem('schachtaktik-reader-category', currentCategory);
  localStorage.setItem('schachtaktik-reader-puzzle', String(currentPuzzleId));
  localStorage.setItem('schachtaktik-reader-step', String(currentStep));
}

function expandFenBoard(fen) {
  const boardPart = fen.split(' ')[0];
  return boardPart.split('/').map(row => {
    const out = [];
    for (const ch of row) {
      if (/\d/.test(ch)) {
        for (let i = 0; i < Number(ch); i++) out.push('.');
      } else {
        out.push(ch);
      }
    }
    return out;
  });
}

function isBlackToMove(fen) {
  return fen.split(' ')[1] === 'b';
}

function renderBoard() {
  const fen = currentFen();
  const board = expandFenBoard(fen);
  const flipped = puzzleOrientationIsBlack();

  boardEl.innerHTML = '';
  for (let viewY = 0; viewY < 8; viewY++) {
    for (let viewX = 0; viewX < 8; viewX++) {
      const boardX = flipped ? 7 - viewX : viewX;
      const boardY = flipped ? 7 - viewY : viewY;

      const sq = document.createElement('div');
      sq.className = 'sq ' + (((viewX + viewY) % 2 === 0) ? 'light' : 'dark');

      if (viewY === 7) {
        const f = document.createElement('span');
        f.className = 'coord-file';
        f.textContent = flipped ? 'hgfedcba'[viewX] : 'abcdefgh'[viewX];
        sq.appendChild(f);
      }
      if (viewX === 0) {
        const r = document.createElement('span');
        r.className = 'coord-rank';
        r.textContent = flipped ? String(viewY + 1) : String(8 - viewY);
        sq.appendChild(r);
      }

      const piece = board[boardY][boardX];
      if (piece !== '.') {
        const img = document.createElement('img');
        img.className = 'piece';
        img.alt = '';
        img.src = pieceImg[piece];
        sq.appendChild(img);
      }
      boardEl.appendChild(sq);
    }
  }
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function sourceSolutionToHtml(text) {
  return escapeHtml(text)
    .replace(/¢/g, '<img class="figurine" src="' + pieceImg.K + '" alt="">')
    .replace(/£/g, '<img class="figurine" src="' + pieceImg.Q + '" alt="">')
    .replace(/¦/g, '<img class="figurine" src="' + pieceImg.R + '" alt="">')
    .replace(/¥/g, '<img class="figurine" src="' + pieceImg.B + '" alt="">')
    .replace(/¤/g, '<img class="figurine" src="' + pieceImg.N + '" alt="">');
}

function renderSolutionLine() {
  const puzzle = currentPuzzle();
  const noEngine = typeof Chess === 'undefined';
  const solutionText = puzzle.displaySolution || puzzle.sourceSolution;
  if ((currentStep === puzzle.moves.length && solutionText && puzzle.moves.length > 0) || (noEngine && solutionText)) {
    solutionLineEl.className = 'solutionline';
    solutionLineEl.innerHTML = sourceSolutionToHtml(solutionText);
  } else {
    solutionLineEl.className = 'solutionline';
    solutionLineEl.textContent = 'Die Lösung wird nach dem Durchklicken der Züge angezeigt.';
  }
}

function syncTaskInput() {
  taskInput.value = String(currentPuzzleId);
  categorySelect.value = currentCategory;
}

function renderStatus() {
  const isBlack = currentPuzzle().fen.split(' ')[1] === 'b';
  const noEngine = typeof Chess === 'undefined';
  statusTextEl.classList.toggle('black-turn', isBlack);
  statusTextEl.classList.toggle('white-turn', !isBlack);
  statusTextEl.innerHTML = `<span class="status-main"><span class="status-dot" aria-hidden="true"></span><span class="status-text"><span class="status-color">${isBlack ? 'Schwarz' : 'Weiß'}</span><span class="status-move">am Zug</span></span></span>${noEngine ? '<div class="status-hint">Nur Ausgangsstellung geladen</div>' : ''}`;
}

function clampStep() {
  currentStep = Math.max(0, Math.min(currentStep, currentPuzzle().moves.length));
}

function updateButtonStates() {
  const puzzle = currentPuzzle();
  const index = currentPuzzleIndex();
  const noEngine = typeof Chess === 'undefined';
  prevTaskBtn.disabled = index <= 0;
  nextTaskBtn.disabled = index >= getPuzzleIds(currentCategory).length - 1;
  startBtn.disabled = noEngine || currentStep <= 0;
  prevMoveBtn.disabled = noEngine || currentStep <= 0;
  nextMoveBtn.disabled = noEngine || currentStep >= puzzle.moves.length;
  endBtn.disabled = noEngine || currentStep >= puzzle.moves.length;
}

function renderAll() {
  clampStep();
  syncTaskInput();
  renderStatus();
  renderBoard();
  renderSolutionLine();
  updateButtonStates();
  saveState();
}

function setPuzzleById(id) {
  if (!getPuzzleIds(currentCategory).includes(id)) return;
  currentPuzzleId = id;
  currentStep = 0;
  renderAll();
}

function setCategory(category) {
  if (!categoryOrder.includes(category)) return;
  currentCategory = category;
  const ids = getPuzzleIds(currentCategory);
  currentPuzzleId = ids[0];
  currentStep = 0;
  renderAll();
}

function goTask(delta) {
  const ids = getPuzzleIds(currentCategory);
  const nextIndex = currentPuzzleIndex() + delta;
  if (nextIndex < 0 || nextIndex >= ids.length) return;
  currentPuzzleId = ids[nextIndex];
  currentStep = 0;
  renderAll();
}

function goStep(delta) {
  const now = Date.now();
  if (now < actionLockedUntil) return;
  currentStep += delta;
  clampStep();
  actionLockedUntil = now + 60;
  renderAll();
}

categorySelect.addEventListener('change', () => {
  runGuardedAction('category-change', () => {
    setCategory(categorySelect.value);
    blurControl(categorySelect);
  });
});

categorySelect.addEventListener('pointerup', () => {
  setTimeout(() => blurControl(categorySelect), 0);
});

categorySelect.addEventListener('wheel', (event) => {
  if (document.activeElement === categorySelect) {
    event.preventDefault();
    blurControl(categorySelect);
  }
}, { passive: false });

taskInput.addEventListener('change', () => {
  runGuardedAction('task-change', () => {
    const value = Number(taskInput.value);
    if (Number.isFinite(value)) {
      if (getPuzzleIds(currentCategory).includes(value)) {
        setPuzzleById(value);
      } else {
        syncTaskInput();
      }
    } else {
      syncTaskInput();
    }
  });
});

taskInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') {
    taskInput.blur();
  }
});

taskInput.addEventListener('wheel', (event) => {
  if (document.activeElement === taskInput) {
    event.preventDefault();
    blurControl(taskInput);
  }
}, { passive: false });

prevTaskBtn.addEventListener('click', () => runGuardedAction('prev-task', () => goTask(-1)));
nextTaskBtn.addEventListener('click', () => runGuardedAction('next-task', () => goTask(1)));
startBtn.addEventListener('click', () => runGuardedAction('start', () => {
  currentStep = 0;
  renderAll();
}));
prevMoveBtn.addEventListener('click', () => runGuardedAction('prev-move', () => goStep(-1)));
nextMoveBtn.addEventListener('click', () => runGuardedAction('next-move', () => goStep(1)));
endBtn.addEventListener('click', () => runGuardedAction('end', () => {
  currentStep = currentPuzzle().moves.length;
  renderAll();
}));

document.addEventListener('keydown', (event) => {
  if (['INPUT', 'SELECT'].includes(document.activeElement?.tagName)) return;
  if (event.key === 'ArrowLeft') {
    event.preventDefault();
    goStep(-1);
  } else if (event.key === 'ArrowRight') {
    event.preventDefault();
    goStep(1);
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    goTask(-1);
  } else if (event.key === 'ArrowDown') {
    event.preventDefault();
    goTask(1);
  }
});

renderAll();
</script>

</body>
