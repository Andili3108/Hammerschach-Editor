name: Update Andili puzzles

on:
  workflow_dispatch:
  schedule:
    # Monatlich aktualisieren reicht, weil die JSON immer heute-6 bis heute+365 enthält.
    - cron: "17 3 3 * *"

permissions:
  contents: write

jobs:
  update-puzzles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip zstandard

      - name: Generate andili-puzzles.json
        run: |
          python generate_andili_puzzles.py \
            --output andili-puzzles.json \
            --days-back 6 \
            --days-ahead 365

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add andili-puzzles.json
          git diff --cached --quiet || git commit -m "Update Andili chess puzzles"
          git push
